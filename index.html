<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; padding: 20px; text-align: center;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
  h2 { margin-top: 0; }
  button, input { width: 100%; padding: 14px; margin: 6px 0; font-size: 18px; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; }
  button { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: 0; }
  #msg { margin-top: 14px; font-size: 18px; }
</style>
</head>
<body>
<h2 id="q">Chargement…</h2>
<div id="choices"></div>
<div id="msg"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxpZTJLwWLKieDVUda8cXB2CJCaj-yJXq0hSfQOa6zz0bStvr8vlC-S-8e9vIm0wc6t/exec";

const tg = Telegram.WebApp;
tg.ready(); tg.expand();
const user = (tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
const name = ((user.first_name || "") + " " + (user.last_name || "")).trim() + (user.username ? " @" + user.username : "");
const $ = id => document.getElementById(id);

async function send(answer) {
  if (!answer.trim()) return;
  $("msg").textContent = "Envoi…";
  const url = API + "?answer=" + encodeURIComponent(answer) + "&id=" + (user.id || "") + "&name=" + encodeURIComponent(name);
  const r = await (await fetch(url)).json();
  $("msg").textContent = r.msg;
  if (r.ok) setTimeout(() => tg.close(), 1200);
}

(async () => {
  const info = await (await fetch(API)).json();
  $("q").textContent = info.question;
  if (info.closed) { $("msg").textContent = "Vote terminé ⛔"; return; }
  const box = $("choices");
  if (info.options.length) {
    info.options.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o; b.onclick = () => send(o); box.appendChild(b);
    });
  } else {
    box.innerHTML = '<input id="a" placeholder="Ta réponse (ex : 3-1)"><button id="go">Envoyer</button>';
    $("go").onclick = () => send($("a").value);
  }
})().catch(() => $("msg").textContent = "Erreur, réessaie.");
</script>
</body>
</html>
